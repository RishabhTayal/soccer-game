<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOCCER — Kickoff</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #061208;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #0d2a12;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: auto;
    cursor: pointer;
    box-shadow: 0 0 0 2px #1a4a22, 0 12px 48px rgba(0,0,0,.55);
    outline: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540" tabindex="0"></canvas></div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = 960, H = 540;

  // ── Pitch geometry ─────────────────────────────────────────
  const PITCH = { x: 36, y: 52, w: 888, h: 468 };
  const GOAL_W = 86;
  const GOAL_D = 18;
  const LINE = 2.2;
  const CENTER_R = 62;
  const PEN_W = 132;
  const PEN_H = 220;
  const SIX_W = 48;
  const SIX_H = 110;
  const SPOT = 88;

  const HOME_GOAL = {
    x: PITCH.x - GOAL_D,
    y: PITCH.y + PITCH.h / 2 - GOAL_W / 2,
    w: GOAL_D,
    h: GOAL_W
  };
  const AWAY_GOAL = {
    x: PITCH.x + PITCH.w,
    y: PITCH.y + PITCH.h / 2 - GOAL_W / 2,
    w: GOAL_D,
    h: GOAL_W
  };

  // ── Tuning ─────────────────────────────────────────────
  const PLAYER_R = 14;
  const BALL_R = 7.2;
  const ACCEL = 920;
  const SPRINT_ACCEL = 1280;
  const MAX_SPD = 198;
  const SPRINT_SPD = 268;
  const FRICTION = 6.4;
  const BALL_FRIC = 1.15;
  const KICK_MIN = 280;
  const KICK_MAX = 620;
  const KICK_RANGE = 26;
  const CHARGE_TIME = 0.55;
  const BOUNCE = 0.72;
  const WALL_BOUNCE = 0.78;
  const HALF_TIME = 120; // 2 minutes per half

  // ── State ──────────────────────────────────────────────
  const keys = Object.create(null);
  let state = "setup"; // setup | play | goal | halftime | over
  let scoreH = 0, scoreA = 0;
  let timeLeft = HALF_TIME;
  let currentHalf = 1; // 1 or 2
  let goalFlash = 0;
  let goalText = "";
  let lastScorer = null;
  let particles = [];
  let charge = 0;
  let charging = false;
  let kickCool = 0;
  let shake = 0;
  let titlePulse = 0;
  let audioOk = false;
  let ac = null;
  let inputLock = 0;

  // Setup choices
  let selectedTeam = "home"; // "home" or "away"
  let selectedDifficulty = "normal"; // "easy", "normal", "hard"
  let setupPhase = "team"; // "team", "difficulty"

  // Difficulty multipliers
  const DIFFICULTY = {
    easy: { aiSpd: 0.7, aiAggr: 0.6, aiAcc: 0.7 },
    normal: { aiSpd: 1.0, aiAggr: 1.0, aiAcc: 1.0 },
    hard: { aiSpd: 1.25, aiAggr: 1.4, aiAcc: 1.3 }
  };

  // Players - 5v5 setup
  let homePlayers = [];
  let awayPlayers = [];
  let controlledPlayer = null;
  let ball = { x: 0, y: 0, vx: 0, vy: 0, rot: 0 };

  function createPlayer(team, num, x, y) {
    return {
      team,
      num: String(num),
      x, y,
      vx: 0, vy: 0,
      facing: team === "home" ? 0 : Math.PI,
      sprint: false,
      kickCool: 0,
      aiCharge: 0,
      aiTarget: null
    };
  }

  // ── Input ──────────────────────────────────────────────
  const down = (e) => {
    keys[e.code] = true;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    
    if (state === "setup") {
      if (setupPhase === "team") {
        if (e.code === "ArrowLeft" || e.code === "KeyA") selectedTeam = "home";
        if (e.code === "ArrowRight" || e.code === "KeyD") selectedTeam = "away";
        if (e.code === "Space" || e.code === "Enter") {
          setupPhase = "difficulty";
          keys.Space = false;
          e.preventDefault();
        }
      } else if (setupPhase === "difficulty") {
        if (e.code === "ArrowLeft" || e.code === "KeyA") {
          if (selectedDifficulty === "normal") selectedDifficulty = "easy";
          else if (selectedDifficulty === "hard") selectedDifficulty = "normal";
        }
        if (e.code === "ArrowRight" || e.code === "KeyD") {
          if (selectedDifficulty === "easy") selectedDifficulty = "normal";
          else if (selectedDifficulty === "normal") selectedDifficulty = "hard";
        }
        if (e.code === "Space" || e.code === "Enter") {
          keys.Space = false;
          startMatch();
          e.preventDefault();
        }
      }
    } else if (state === "halftime" && (e.code === "Space" || e.code === "Enter")) {
      keys.Space = false;
      startSecondHalf();
      e.preventDefault();
    } else if (state === "over" && (e.code === "Space" || e.code === "Enter")) {
      keys.Space = false;
      backToSetup();
      e.preventDefault();
    }
  };

  const up = (e) => {
    keys[e.code] = false;
    if (e.code === "Space" && state === "play" && charging && inputLock <= 0) {
      doKick(controlledPlayer, charge);
      charging = false;
      charge = 0;
    }
  };

  window.addEventListener("keydown", down);
  window.addEventListener("keyup", up);

  // Focus canvas on click and handle setup/over states
  canvas.addEventListener("mousedown", () => {
    canvas.focus();
    if (state === "setup") {
      if (setupPhase === "team") {
        setupPhase = "difficulty";
      } else {
        startMatch();
      }
    } else if (state === "halftime") {
      startSecondHalf();
    } else if (state === "over") {
      backToSetup();
    }
  });

  // Ensure canvas is focused on page load
  canvas.focus();
  canvas.addEventListener("focus", () => {
    canvas.style.boxShadow = "0 0 0 2px #1a4a22, 0 12px 48px rgba(0,0,0,.55)";
  });

  window.addEventListener("blur", () => {
    for (const k of Object.keys(keys)) keys[k] = false;
    charging = false;
    charge = 0;
  });

  // ── Audio (optional, mute-safe) ─────────────────────────────
  function ensureAudio() {
    if (audioOk) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      audioOk = true;
    } catch (_) { audioOk = false; }
  }
  function blip(freq, dur, type, vol, slide) {
    if (!audioOk || !ac) return;
    try {
      const t = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  }
  function sfxKick(pow) {
    blip(140 + pow * 80, 0.09, "triangle", 0.07, 60);
  }
  function sfxGoal() {
    blip(330, 0.18, "square", 0.07, 520);
    setTimeout(() => blip(440, 0.22, "square", 0.06, 660), 90);
    setTimeout(() => blip(550, 0.28, "triangle", 0.05, 880), 180);
  }
  function sfxWhistle() {
    blip(880, 0.35, "square", 0.05, 920);
  }

  // ── Helpers ─────────────────────────────────────────────
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const len = (x, y) => Math.hypot(x, y);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const ang = (x, y) => Math.atan2(y, x);

  function initTeams() {
    homePlayers = [];
    awayPlayers = [];

    // 5v5 formation: GK, 2 defenders, 2 midfielders (one controlled if user picked home)
    const homeNums = ["1", "5", "3", "8", "10"];
    const awayNums = ["1", "4", "6", "7", "9"];
    
    // Home formation (attacking right initially)
    const homeXBase = [0.15, 0.28, 0.28, 0.42, 0.42];
    const homeY = [0.5, 0.3, 0.7, 0.35, 0.65];
    
    for (let i = 0; i < 5; i++) {
      const px = PITCH.x + PITCH.w * homeXBase[i];
      const py = PITCH.y + PITCH.h * homeY[i];
      homePlayers.push(createPlayer("home", homeNums[i], px, py));
    }

    // Away formation (attacking left initially)
    const awayXBase = [0.85, 0.72, 0.72, 0.58, 0.58];
    const awayY = [0.5, 0.3, 0.7, 0.35, 0.65];
    
    for (let i = 0; i < 5; i++) {
      const px = PITCH.x + PITCH.w * awayXBase[i];
      const py = PITCH.y + PITCH.h * awayY[i];
      awayPlayers.push(createPlayer("away", awayNums[i], px, py));
    }

    // Set controlled player (midfielder - index 3)
    if (selectedTeam === "home") {
      controlledPlayer = homePlayers[3];
    } else {
      controlledPlayer = awayPlayers[3];
    }
  }

  function resetPositions(kickoffTo) {
    const halfProgress = currentHalf === 2 ? 1 : 0;
    
    // Reset all players to formation positions
    const homeXBase = halfProgress ? [0.85, 0.72, 0.72, 0.58, 0.58] : [0.15, 0.28, 0.28, 0.42, 0.42];
    const homeY = [0.5, 0.3, 0.7, 0.35, 0.65];
    
    for (let i = 0; i < homePlayers.length; i++) {
      homePlayers[i].x = PITCH.x + PITCH.w * homeXBase[i];
      homePlayers[i].y = PITCH.y + PITCH.h * homeY[i];
      homePlayers[i].vx = homePlayers[i].vy = 0;
      homePlayers[i].facing = halfProgress ? Math.PI : 0;
      homePlayers[i].kickCool = 0;
      homePlayers[i].aiCharge = 0;
    }

    const awayXBase = halfProgress ? [0.15, 0.28, 0.28, 0.42, 0.42] : [0.85, 0.72, 0.72, 0.58, 0.58];
    const awayY = [0.5, 0.3, 0.7, 0.35, 0.65];
    
    for (let i = 0; i < awayPlayers.length; i++) {
      awayPlayers[i].x = PITCH.x + PITCH.w * awayXBase[i];
      awayPlayers[i].y = PITCH.y + PITCH.h * awayY[i];
      awayPlayers[i].vx = awayPlayers[i].vy = 0;
      awayPlayers[i].facing = halfProgress ? 0 : Math.PI;
      awayPlayers[i].kickCool = 0;
      awayPlayers[i].aiCharge = 0;
    }

    ball.x = PITCH.x + PITCH.w * 0.5;
    ball.y = PITCH.y + PITCH.h * 0.5;
    ball.vx = ball.vy = 0;
    ball.rot = 0;
    charge = 0;
    charging = false;

    if (kickoffTo === "home") {
      ball.x -= halfProgress ? 8 : -8;
    } else if (kickoffTo === "away") {
      ball.x += halfProgress ? 8 : -8;
    }
  }

  function backToSetup() {
    state = "setup";
    setupPhase = "team";
    selectedTeam = "home";
    selectedDifficulty = "normal";
    canvas.focus();
  }

  function startMatch() {
    ensureAudio();
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
    
    initTeams();
    scoreH = 0;
    scoreA = 0;
    currentHalf = 1;
    timeLeft = HALF_TIME;
    particles = [];
    goalFlash = 0;
    shake = 0;
    lastScorer = null;
    resetPositions();
    state = "play";
    inputLock = 0.28;
    keys.Space = false;
    charging = false;
    charge = 0;
    sfxWhistle();
    canvas.focus();
  }

  function startSecondHalf() {
    currentHalf = 2;
    timeLeft = HALF_TIME;
    resetPositions();
    state = "play";
    inputLock = 0.28;
    keys.Space = false;
    charging = false;
    charge = 0;
    sfxWhistle();
    canvas.focus();
  }

  function spawnBurst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 280;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.45 + Math.random() * 0.55,
        max: 1,
        r: 1.5 + Math.random() * 2.8,
        c: color
      });
    }
  }

  function scoreGoal(who) {
    if (state !== "play") return;
    if (who === "home") scoreH++;
    else scoreA++;
    lastScorer = who;
    goalText = "GOAL!";
    goalFlash = 1.35;
    shake = 10;
    state = "goal";
    const halfProgress = currentHalf === 2 ? 1 : 0;
    const gx = who === "home" ? 
      (halfProgress ? HOME_GOAL.x : AWAY_GOAL.x + AWAY_GOAL.w) :
      (halfProgress ? AWAY_GOAL.x + AWAY_GOAL.w : HOME_GOAL.x);
    const gy = PITCH.y + PITCH.h / 2;
    spawnBurst(gx, gy, "#fff8c8", 42);
    spawnBurst(gx, gy, who === "home" ? "#6aa8ff" : "#ff7a7a", 22);
    sfxGoal();
  }

  function afterGoal() {
    if (timeLeft <= 0) {
      if (currentHalf === 1) {
        state = "halftime";
        sfxWhistle();
      } else {
        state = "over";
        sfxWhistle();
      }
      return;
    }
    resetPositions(lastScorer === "home" ? "away" : "home");
    state = "play";
  }

  // ── Physics ─────────────────────────────────────────────
  function movePlayer(p, ix, iy, sprint, maxSpd, dt) {
    const acc = sprint ? SPRINT_ACCEL : ACCEL;
    const cap = sprint ? SPRINT_SPD : maxSpd;
    if (ix || iy) {
      const n = len(ix, iy) || 1;
      p.vx += (ix / n) * acc * dt;
      p.vy += (iy / n) * acc * dt;
      p.facing = ang(ix, iy);
    }
    const damp = Math.exp(-FRICTION * dt);
    p.vx *= damp;
    p.vy *= damp;
    const sp = len(p.vx, p.vy);
    if (sp > cap) {
      p.vx = (p.vx / sp) * cap;
      p.vy = (p.vy / sp) * cap;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    const minX = PITCH.x + PLAYER_R + 2;
    const maxX = PITCH.x + PITCH.w - PLAYER_R - 2;
    const minY = PITCH.y + PLAYER_R + 2;
    const maxY = PITCH.y + PITCH.h - PLAYER_R - 2;
    if (p.x < minX) { p.x = minX; p.vx *= -0.3; }
    if (p.x > maxX) { p.x = maxX; p.vx *= -0.3; }
    if (p.y < minY) { p.y = minY; p.vy *= -0.3; }
    if (p.y > maxY) { p.y = maxY; p.vy *= -0.3; }
  }

  function collidePlayers(players) {
    for (let i = 0; i < players.length; i++) {
      for (let j = i + 1; j < players.length; j++) {
        const a = players[i], b = players[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const min = PLAYER_R * 2;
        if (d < min && d > 0.001) {
          const nx = dx / d, ny = dy / d;
          const overlap = (min - d) * 0.5;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const j = vn * 0.85;
            a.vx += j * nx; a.vy += j * ny;
            b.vx -= j * nx; b.vy -= j * ny;
          }
        }
      }
    }
  }

  function collideBallPlayer(p) {
    const dx = ball.x - p.x, dy = ball.y - p.y;
    const d = Math.hypot(dx, dy);
    const min = PLAYER_R + BALL_R;
    if (d < min && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      const overlap = min - d;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const rvx = ball.vx - p.vx, rvy = ball.vy - p.vy;
      const vn = rvx * nx + rvy * ny;
      if (vn < 0) {
        ball.vx -= vn * (1 + BOUNCE) * nx;
        ball.vy -= vn * (1 + BOUNCE) * ny;
        ball.vx += p.vx * 0.35;
        ball.vy += p.vy * 0.35;
      }
    }
  }

  function inGoalMouth(x, y, goal) {
    return y >= goal.y + 3 && y <= goal.y + goal.h - 3;
  }

  function updateBall(dt) {
    const damp = Math.exp(-BALL_FRIC * dt);
    ball.vx *= damp;
    ball.vy *= damp;
    if (len(ball.vx, ball.vy) < 4) { ball.vx = 0; ball.vy = 0; }
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.rot += len(ball.vx, ball.vy) * dt * 0.18;

    const left = PITCH.x + BALL_R;
    const right = PITCH.x + PITCH.w - BALL_R;
    const top = PITCH.y + BALL_R;
    const bot = PITCH.y + PITCH.h - BALL_R;

    if (ball.y < top) { ball.y = top; ball.vy = Math.abs(ball.vy) * WALL_BOUNCE; }
    if (ball.y > bot) { ball.y = bot; ball.vy = -Math.abs(ball.vy) * WALL_BOUNCE; }

    // Goals are fixed - HOME on left, AWAY on right
    // In second half, teams switch ends, so scoring logic adjusts
    const halfProgress = currentHalf === 2;
    
    // Left side — home goal
    if (ball.x < left) {
      if (inGoalMouth(ball.x, ball.y, HOME_GOAL)) {
        if (ball.x < HOME_GOAL.x + BALL_R) {
          // Ball entered left goal
          scoreGoal(halfProgress ? "home" : "away");
        }
      } else {
        ball.x = left;
        ball.vx = Math.abs(ball.vx) * WALL_BOUNCE;
      }
    }
    // Right side — away goal
    if (ball.x > right) {
      if (inGoalMouth(ball.x, ball.y, AWAY_GOAL)) {
        if (ball.x > AWAY_GOAL.x + AWAY_GOAL.w - BALL_R) {
          // Ball entered right goal
          scoreGoal(halfProgress ? "away" : "home");
        }
      } else {
        ball.x = right;
        ball.vx = -Math.abs(ball.vx) * WALL_BOUNCE;
      }
    }

    // Goal posts
    bouncePost(PITCH.x, HOME_GOAL.y);
    bouncePost(PITCH.x, HOME_GOAL.y + HOME_GOAL.h);
    bouncePost(PITCH.x + PITCH.w, AWAY_GOAL.y);
    bouncePost(PITCH.x + PITCH.w, AWAY_GOAL.y + AWAY_GOAL.h);

    // Keep ball in goal nets vertically
    if (ball.x < PITCH.x) {
      if (ball.y < HOME_GOAL.y + BALL_R) { ball.y = HOME_GOAL.y + BALL_R; ball.vy *= -WALL_BOUNCE; }
      if (ball.y > HOME_GOAL.y + HOME_GOAL.h - BALL_R) { ball.y = HOME_GOAL.y + HOME_GOAL.h - BALL_R; ball.vy *= -WALL_BOUNCE; }
    }
    if (ball.x > PITCH.x + PITCH.w) {
      if (ball.y < AWAY_GOAL.y + BALL_R) { ball.y = AWAY_GOAL.y + BALL_R; ball.vy *= -WALL_BOUNCE; }
      if (ball.y > AWAY_GOAL.y + AWAY_GOAL.h - BALL_R) { ball.y = AWAY_GOAL.y + AWAY_GOAL.h - BALL_R; ball.vy *= -WALL_BOUNCE; }
    }
  }

  function bouncePost(px, py) {
    const dx = ball.x - px, dy = ball.y - py;
    const d = Math.hypot(dx, dy);
    const min = BALL_R + 4;
    if (d < min && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      ball.x = px + nx * min;
      ball.y = py + ny * min;
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) {
        ball.vx -= vn * 1.6 * nx;
        ball.vy -= vn * 1.6 * ny;
      }
    }
  }

  function doKick(p, pow) {
    if (!p || dist(p, ball) > KICK_RANGE + 6) return;
    const pwr = KICK_MIN + (KICK_MAX - KICK_MIN) * clamp(pow, 0.18, 1);
    const toBx = ball.x - p.x, toBy = ball.y - p.y;
    const td = Math.hypot(toBx, toBy) || 1;
    const fx = Math.cos(p.facing), fy = Math.sin(p.facing);
    let dx = fx * 0.72 + (toBx / td) * 0.28;
    let dy = fy * 0.72 + (toBy / td) * 0.28;
    const n = Math.hypot(dx, dy) || 1;
    dx /= n; dy /= n;
    ball.vx += dx * pwr + p.vx * 0.25;
    ball.vy += dy * pwr + p.vy * 0.25;
    p.vx -= dx * 40;
    p.vy -= dy * 40;
    spawnBurst(ball.x, ball.y, "rgba(255,255,255,0.85)", 6);
    sfxKick(pow);
    p.kickCool = p === controlledPlayer ? 0.16 : 0.2;
  }

  // ── AI ────────────────────────────────────────────────
  function updateAI(dt) {
    const diff = DIFFICULTY[selectedDifficulty];
    const baseMaxSpd = 214 * diff.aiSpd;
    const baseSprintSpd = 252 * diff.aiSpd;

    const allPlayers = [...homePlayers, ...awayPlayers];
    const halfProgress = currentHalf === 2;

    // Process each AI player
    for (const p of allPlayers) {
      if (p === controlledPlayer) continue; // Skip human-controlled player

      const isHome = p.team === "home";
      const myGoalX = halfProgress ? 
        (isHome ? PITCH.x + PITCH.w - 8 : PITCH.x + 8) :
        (isHome ? PITCH.x + 8 : PITCH.x + PITCH.w - 8);
      const oppGoalX = halfProgress ?
        (isHome ? PITCH.x + 8 : PITCH.x + PITCH.w - 8) :
        (isHome ? PITCH.x + PITCH.w - 8 : PITCH.x + 8);
      const goalY = PITCH.y + PITCH.h * 0.5;
      const midX = PITCH.x + PITCH.w * 0.5;

      // Predict ball position
      const look = 0.28;
      const px = ball.x + ball.vx * look;
      const py = ball.y + ball.vy * look;

      const dBall = dist(p, ball);
      const ballInMyHalf = halfProgress ?
        (isHome ? ball.x > midX : ball.x < midX) :
        (isHome ? ball.x < midX : ball.x > midX);

      // Find closest teammate and opponent to ball
      let closestTeammate = null;
      let closestTeammateDist = Infinity;
      let closestOpp = null;
      let closestOppDist = Infinity;

      for (const other of allPlayers) {
        if (other === p) continue;
        const d = dist(other, ball);
        if (other.team === p.team) {
          if (d < closestTeammateDist) {
            closestTeammateDist = d;
            closestTeammate = other;
          }
        } else {
          if (d < closestOppDist) {
            closestOppDist = d;
            closestOpp = other;
          }
        }
      }

      const IamClosest = dBall < closestTeammateDist - 12;
      
      let tx, ty, wantKick = false, wantSprint = false;

      // Role-based behavior (GK = #1, others are outfield)
      const isGK = p.num === "1";

      if (isGK) {
        // Goalkeeper: stay near goal, intercept if ball comes close
        if (dBall < 140 && ballInMyHalf) {
          tx = ball.x * 0.4 + myGoalX * 0.6;
          ty = ball.y * 0.7 + goalY * 0.3;
          wantSprint = dBall < 80;
          if (dBall < KICK_RANGE + 8) {
            wantKick = true;
            p.aiCharge = Math.min(0.8, p.aiCharge + dt / 0.4);
            p.facing = ang(oppGoalX - p.x, goalY - p.y);
          }
        } else {
          // Stay in goal area
          tx = myGoalX;
          ty = goalY;
        }
      } else {
        // Outfield player
        if (dBall < KICK_RANGE + 4 && IamClosest) {
          // I have the ball - dribble or shoot
          const toGoalX = oppGoalX - p.x;
          const toGoalY = goalY - p.y;
          p.facing = ang(toGoalX, toGoalY);
          
          // Get behind ball
          const behind = 16;
          const gx = oppGoalX - ball.x, gy = goalY - ball.y;
          const gn = Math.hypot(gx, gy) || 1;
          tx = ball.x - (gx / gn) * behind;
          ty = ball.y - (gy / gn) * behind;

          const distToGoal = Math.hypot(ball.x - oppGoalX, ball.y - goalY);
          const attacking = halfProgress ?
            (isHome ? ball.x < midX + 100 : ball.x > midX - 100) :
            (isHome ? ball.x > midX - 100 : ball.x < midX + 100);

          if (attacking || distToGoal < 260) {
            wantKick = true;
            p.aiCharge = Math.min(1, p.aiCharge + dt / (0.38 * diff.aiAggr));
          } else if (IamClosest) {
            wantKick = p.aiCharge > 0.25;
            p.aiCharge = Math.min(0.55, p.aiCharge + dt / 0.5);
          }
        } else if (IamClosest && dBall < 90) {
          // Chase ball
          tx = px;
          ty = py;
          wantSprint = dBall > 50 || len(ball.vx, ball.vy) > 160;
          p.aiCharge = 0;
        } else if (ballInMyHalf && dBall < 180 * diff.aiAggr) {
          // Defensive positioning
          tx = ball.x * 0.45 + myGoalX * 0.55;
          ty = ball.y * 0.6 + goalY * 0.4;
          wantSprint = dBall < 70 && closestOppDist < dBall;
          p.aiCharge = 0;
        } else {
          // Supporting position - spread out
          const attackSide = halfProgress ? (isHome ? -1 : 1) : (isHome ? 1 : -1);
          const supportX = ball.x + attackSide * 90;
          const supportY = p.y; // Maintain lane
          tx = supportX * 0.7 + p.x * 0.3;
          ty = supportY * 0.8 + ball.y * 0.2;
          p.aiCharge = 0;
        }
      }

      tx = clamp(tx, PITCH.x + 22, PITCH.x + PITCH.w - 22);
      ty = clamp(ty, PITCH.y + 22, PITCH.y + PITCH.h - 22);

      let ix = tx - p.x, iy = ty - p.y;
      const id = Math.hypot(ix, iy);
      if (id < 6) { ix = 0; iy = 0; }

      movePlayer(p, ix, iy, wantSprint, baseMaxSpd, dt);

      if (ix || iy) {
        p.facing = ang(ix, iy);
      }
      if (wantKick && dBall < KICK_RANGE + 3) {
        const toGoal = ang(oppGoalX - p.x, goalY - p.y);
        p.facing = toGoal;
      }

      p.kickCool = Math.max(0, p.kickCool - dt);
      if (wantKick && p.kickCool <= 0 && dBall < KICK_RANGE + 2) {
        if (p.aiCharge >= 0.42 * diff.aiAcc || (dBall < KICK_RANGE - 2 && p.aiCharge > 0.18)) {
          doKick(p, Math.max(0.45, p.aiCharge));
          p.aiCharge = 0;
        }
      }
    }
  }

  // ── Human ──────────────────────────────────────────────
  function updateHuman(dt) {
    if (!controlledPlayer) return;
    if (inputLock > 0) inputLock -= dt;
    
    let ix = 0, iy = 0;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iy -= 1;
    if (keys.KeyS || keys.ArrowDown) iy += 1;
    
    const sprint = !!(keys.ShiftLeft || keys.ShiftRight);
    controlledPlayer.sprint = sprint;
    movePlayer(controlledPlayer, ix, iy, sprint, MAX_SPD, dt);

    kickCool = Math.max(0, kickCool - dt);
    if (keys.Space && state === "play" && inputLock <= 0) {
      if (!charging && kickCool <= 0) {
        charging = true;
        charge = 0.12;
      }
      if (charging) charge = Math.min(1, charge + dt / CHARGE_TIME);
      if (charging && charge >= 1) {
        doKick(controlledPlayer, 1);
        charging = false;
        charge = 0;
      }
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ── Draw ────────────────────────────────────────────────
  function drawPitch() {
    // Outer dark
    ctx.fillStyle = "#0b1f10";
    ctx.fillRect(0, 0, W, H);

    // Grass stripes
    const stripe = 36;
    for (let i = 0; i < PITCH.w / stripe + 1; i++) {
      ctx.fillStyle = i % 2 === 0 ? "#1f7a32" : "#1a6c2c";
      ctx.fillRect(PITCH.x + i * stripe, PITCH.y, stripe, PITCH.h);
    }

    // Subtle noise / wear via extra bands
    ctx.save();
    ctx.beginPath();
    ctx.rect(PITCH.x, PITCH.y, PITCH.w, PITCH.h);
    ctx.clip();
    ctx.globalAlpha = 0.07;
    for (let i = 0; i < 18; i++) {
      ctx.fillStyle = i % 2 ? "#0a3d16" : "#2a9a44";
      ctx.fillRect(PITCH.x, PITCH.y + i * (PITCH.h / 18), PITCH.w, 2);
    }
    ctx.restore();

    // Surround
    ctx.strokeStyle = "#0e2a14";
    ctx.lineWidth = 10;
    ctx.strokeRect(PITCH.x - 8, PITCH.y - 8, PITCH.w + 16, PITCH.h + 16);

    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.92)";
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.lineWidth = LINE;
    ctx.lineJoin = "round";

    // Touchlines
    ctx.strokeRect(PITCH.x, PITCH.y, PITCH.w, PITCH.h);

    const cx = PITCH.x + PITCH.w / 2;
    const cy = PITCH.y + PITCH.h / 2;

    // Halfway
    ctx.beginPath();
    ctx.moveTo(cx, PITCH.y);
    ctx.lineTo(cx, PITCH.y + PITCH.h);
    ctx.stroke();

    // Center circle + spot
    ctx.beginPath();
    ctx.arc(cx, cy, CENTER_R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
    ctx.fill();

    function box(side) {
      const x = side === "L" ? PITCH.x : PITCH.x + PITCH.w - PEN_W;
      ctx.strokeRect(x, cy - PEN_H / 2, PEN_W, PEN_H);
      const sx = side === "L" ? PITCH.x : PITCH.x + PITCH.w - SIX_W;
      ctx.strokeRect(sx, cy - SIX_H / 2, SIX_W, SIX_H);
      const spotX = side === "L" ? PITCH.x + SPOT : PITCH.x + PITCH.w - SPOT;
      ctx.beginPath();
      ctx.arc(spotX, cy, 2.6, 0, Math.PI * 2);
      ctx.fill();
      // Penalty arc
      ctx.beginPath();
      if (side === "L") ctx.arc(spotX, cy, 46, -0.95, 0.95);
      else ctx.arc(spotX, cy, 46, Math.PI - 0.95, Math.PI + 0.95);
      ctx.stroke();
    }
    box("L");
    box("R");

    // Corners
    function corner(x, y, a0, a1) {
      ctx.beginPath();
      ctx.arc(x, y, 10, a0, a1);
      ctx.stroke();
    }
    corner(PITCH.x, PITCH.y, 0, Math.PI / 2);
    corner(PITCH.x + PITCH.w, PITCH.y, Math.PI / 2, Math.PI);
    corner(PITCH.x, PITCH.y + PITCH.h, -Math.PI / 2, 0);
    corner(PITCH.x + PITCH.w, PITCH.y + PITCH.h, Math.PI, Math.PI * 1.5);

    ctx.restore();

    drawGoal(HOME_GOAL, "L");
    drawGoal(AWAY_GOAL, "R");
  }

  function drawGoal(g, side) {
    // Net
    ctx.save();
    ctx.beginPath();
    ctx.rect(g.x, g.y, g.w, g.h);
    ctx.clip();
    ctx.fillStyle = "rgba(200,220,210,0.16)";
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.strokeStyle = "rgba(230,245,235,0.35)";
    ctx.lineWidth = 1;
    const step = 6;
    for (let x = g.x; x <= g.x + g.w; x += step) {
      ctx.beginPath(); ctx.moveTo(x, g.y); ctx.lineTo(x, g.y + g.h); ctx.stroke();
    }
    for (let y = g.y; y <= g.y + g.h; y += step) {
      ctx.beginPath(); ctx.moveTo(g.x, y); ctx.lineTo(g.x + g.w, y); ctx.stroke();
    }
    ctx.restore();

    // Frame
    ctx.strokeStyle = "#f2f6f2";
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    if (side === "L") {
      ctx.moveTo(PITCH.x, g.y);
      ctx.lineTo(g.x, g.y);
      ctx.lineTo(g.x, g.y + g.h);
      ctx.lineTo(PITCH.x, g.y + g.h);
    } else {
      ctx.moveTo(PITCH.x + PITCH.w, g.y);
      ctx.lineTo(g.x + g.w, g.y);
      ctx.lineTo(g.x + g.w, g.y + g.h);
      ctx.lineTo(PITCH.x + PITCH.w, g.y + g.h);
    }
    ctx.stroke();

    // Posts
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(PITCH.x + (side === "L" ? 0 : PITCH.w), g.y, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(PITCH.x + (side === "L" ? 0 : PITCH.w), g.y + g.h, 3.6, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlayer(p, color, accent, isControlled) {
    // Shadow
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.beginPath();
    ctx.ellipse(p.x + 1, p.y + PLAYER_R + 1, PLAYER_R * 0.86, 4.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Controlled player highlight ring
    if (isControlled) {
      ctx.strokeStyle = "rgba(255,255,100,0.75)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, PLAYER_R + 5, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, PLAYER_R + 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Body
    const grd = ctx.createRadialGradient(p.x - 4, p.y - 5, 2, p.x, p.y, PLAYER_R + 1);
    grd.addColorStop(0, accent);
    grd.addColorStop(1, color);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Facing
    const fx = Math.cos(p.facing), fy = Math.sin(p.facing);
    ctx.strokeStyle = "rgba(255,255,255,0.88)";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(p.x + fx * 4, p.y + fy * 4);
    ctx.lineTo(p.x + fx * (PLAYER_R + 7), p.y + fy * (PLAYER_R + 7));
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(p.x + fx * (PLAYER_R + 6), p.y + fy * (PLAYER_R + 6), 3.1, 0, Math.PI * 2);
    ctx.fill();

    // Number
    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 2;
    ctx.fillText(p.num, p.x, p.y + 0.5);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawBall() {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(ball.x + 1.5, ball.y + BALL_R + 2, BALL_R * 0.95, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.rot);
    const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, BALL_R);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, "#d8d8d8");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(30,30,30,0.55)";
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // Simple patches
    ctx.fillStyle = "rgba(20,20,20,0.72)";
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      const r = BALL_R * 0.42;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    // Top bar
    const barH = 44;
    const hg = ctx.createLinearGradient(0, 0, 0, barH);
    hg.addColorStop(0, "rgba(6,16,8,0.82)");
    hg.addColorStop(1, "rgba(6,16,8,0.35)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, barH);

    // Home badge
    ctx.fillStyle = "#2b6cff";
    roundRect(18, 8, 86, 28, 6);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("HOME", 61, 23);

    ctx.fillStyle = "#c62828";
    roundRect(W - 104, 8, 86, 28, 6);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText("AWAY", W - 61, 23);

    // Score
    ctx.fillStyle = "#f4f7f2";
    ctx.font = "bold 26px Trebuchet MS, sans-serif";
    ctx.fillText(String(scoreH), 132, 23);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "bold 18px Trebuchet MS, sans-serif";
    ctx.fillText("–", W / 2, 23);
    ctx.fillStyle = "#f4f7f2";
    ctx.font = "bold 26px Trebuchet MS, sans-serif";
    ctx.fillText(String(scoreA), W - 132, 23);

    // Timer and half indicator
    if (state === "play" || state === "goal") {
      const m = Math.floor(Math.max(0, timeLeft) / 60);
      const s = Math.floor(Math.max(0, timeLeft) % 60);
      const clock = m + ":" + String(s).padStart(2, "0");
      ctx.fillStyle = timeLeft <= 15 && state === "play" ? "#ffd166" : "#e8f0e4";
      ctx.font = "bold 20px Trebuchet MS, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(clock, W / 2, 18);
      
      // Half indicator
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.font = "11px Trebuchet MS, sans-serif";
      ctx.fillText(currentHalf === 1 ? "1st Half" : "2nd Half", W / 2, 30);
    }

    // Kick charge
    if (state === "play" && (charging || charge > 0)) {
      const bw = 120, bh = 8;
      const bx = 20, by = H - 22;
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      roundRect(bx, by, bw, bh, 4); ctx.fill();
      const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grd.addColorStop(0, "#7cff8a");
      grd.addColorStop(0.7, "#ffe566");
      grd.addColorStop(1, "#ff5a5a");
      ctx.fillStyle = grd;
      roundRect(bx, by, bw * charge, bh, 4); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "10px Trebuchet MS, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("KICK", bx, by - 6);
    }

    // Controls hint
    if (state === "play") {
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.font = "11px Trebuchet MS, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("WASD / arrows  ·  Space kick  ·  Shift sprint", W - 18, H - 14);
    }
  }

  function roundRect(x, y, w, h, r) {
    if (w <= 0) return;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / 0.6, 0, 1);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay() {
    if (state === "setup") {
      ctx.fillStyle = "rgba(4,12,6,0.72)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#f4fff0";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 86px Trebuchet MS, sans-serif";
      ctx.shadowColor = "rgba(40,180,70,0.45)";
      ctx.shadowBlur = 24;
      ctx.fillText("SOCCER", W / 2, H * 0.22);
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#9ae08a";
      ctx.font = "italic 22px Trebuchet MS, sans-serif";
      ctx.fillText("KICKOFF", W / 2, H * 0.22 + 52);

      if (setupPhase === "team") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px Trebuchet MS, sans-serif";
        ctx.fillText("SELECT YOUR TEAM", W / 2, H * 0.42);

        // Home option
        const homeX = W / 2 - 140;
        const homeY = H * 0.55;
        ctx.fillStyle = selectedTeam === "home" ? "#2b6cff" : "rgba(43,108,255,0.4)";
        roundRect(homeX - 70, homeY - 30, 140, 60, 8);
        ctx.fill();
        if (selectedTeam === "home") {
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px Trebuchet MS, sans-serif";
        ctx.fillText("HOME", homeX, homeY);
        ctx.font = "14px Trebuchet MS, sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fillText("Blue", homeX, homeY + 20);

        // Away option
        const awayX = W / 2 + 140;
        const awayY = H * 0.55;
        ctx.fillStyle = selectedTeam === "away" ? "#c62828" : "rgba(198,40,40,0.4)";
        roundRect(awayX - 70, awayY - 30, 140, 60, 8);
        ctx.fill();
        if (selectedTeam === "away") {
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px Trebuchet MS, sans-serif";
        ctx.fillText("AWAY", awayX, awayY);
        ctx.font = "14px Trebuchet MS, sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fillText("Red", awayX, awayY + 20);

        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.font = "15px Trebuchet MS, sans-serif";
        ctx.fillText("Use  A / D  or  arrows  to choose", W / 2, H * 0.72);

        const pulse = 0.85 + Math.sin(titlePulse * 3) * 0.15;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Trebuchet MS, sans-serif";
        ctx.fillText("Press  SPACE  or  click  to continue", W / 2, H * 0.82);
        ctx.globalAlpha = 1;

      } else if (setupPhase === "difficulty") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px Trebuchet MS, sans-serif";
        ctx.fillText("SELECT DIFFICULTY", W / 2, H * 0.42);

        const levels = ["easy", "normal", "hard"];
        const levelLabels = ["EASY", "NORMAL", "HARD"];
        const levelDescs = ["Casual", "Balanced", "Challenge"];
        const levelColors = ["#5fb35f", "#ffa726", "#e63946"];
        
        for (let i = 0; i < 3; i++) {
          const lx = W / 2 + (i - 1) * 160;
          const ly = H * 0.55;
          const level = levels[i];
          
          ctx.fillStyle = selectedDifficulty === level ? levelColors[i] : `rgba(${level === "easy" ? "95,179,95" : level === "normal" ? "255,167,38" : "230,57,70"},0.4)`;
          roundRect(lx - 60, ly - 30, 120, 60, 8);
          ctx.fill();
          if (selectedDifficulty === level) {
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.stroke();
          }
          ctx.fillStyle = "#fff";
          ctx.font = "bold 18px Trebuchet MS, sans-serif";
          ctx.fillText(levelLabels[i], lx, ly);
          ctx.font = "13px Trebuchet MS, sans-serif";
          ctx.fillStyle = "rgba(255,255,255,0.8)";
          ctx.fillText(levelDescs[i], lx, ly + 20);
        }

        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.font = "15px Trebuchet MS, sans-serif";
        ctx.fillText("Use  A / D  or  arrows  to choose", W / 2, H * 0.72);

        const pulse = 0.85 + Math.sin(titlePulse * 3) * 0.15;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Trebuchet MS, sans-serif";
        ctx.fillText("Press  SPACE  or  click  to start", W / 2, H * 0.82);
        ctx.globalAlpha = 1;
      }
    }

    if (state === "goal") {
      ctx.fillStyle = `rgba(255,245,180,${0.12 * clamp(goalFlash, 0, 1)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.globalAlpha = clamp(goalFlash * 1.2, 0, 1);
      ctx.fillStyle = "#fffef2";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 72px Trebuchet MS, sans-serif";
      ctx.shadowColor = lastScorer === "home" ? "rgba(50,110,255,0.7)" : "rgba(220,40,40,0.7)";
      ctx.shadowBlur = 18;
      ctx.fillText(goalText, W / 2, H * 0.46);
      ctx.shadowBlur = 0;
      ctx.font = "bold 18px Trebuchet MS, sans-serif";
      ctx.fillStyle = lastScorer === "home" ? "#9ec0ff" : "#ff9a9a";
      ctx.fillText(lastScorer === "home" ? "HOME" : "AWAY", W / 2, H * 0.46 + 48);
      ctx.restore();
    }

    if (state === "halftime") {
      ctx.fillStyle = "rgba(4,10,6,0.75)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#f4fff0";
      ctx.font = "bold 56px Trebuchet MS, sans-serif";
      ctx.shadowColor = "rgba(100,200,120,0.5)";
      ctx.shadowBlur = 18;
      ctx.fillText("HALF TIME", W / 2, H * 0.36);
      ctx.shadowBlur = 0;
      
      ctx.font = "bold 48px Trebuchet MS, sans-serif";
      ctx.fillText(scoreH + "  –  " + scoreA, W / 2, H * 0.50);
      
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "18px Trebuchet MS, sans-serif";
      ctx.fillText("Teams switch ends", W / 2, H * 0.62);
      
      const pulse = 0.85 + Math.sin(titlePulse * 3) * 0.15;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px Trebuchet MS, sans-serif";
      ctx.fillText("Press  SPACE  or  click  for second half", W / 2, H * 0.74);
      ctx.globalAlpha = 1;
    }

    if (state === "over") {
      ctx.fillStyle = "rgba(4,10,6,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#f4fff0";
      ctx.font = "bold 48px Trebuchet MS, sans-serif";
      ctx.fillText("FULL TIME", W / 2, H * 0.32);
      ctx.font = "bold 64px Trebuchet MS, sans-serif";
      ctx.fillText(scoreH + "  –  " + scoreA, W / 2, H * 0.48);
      let result = "DRAW";
      if (scoreH > scoreA) result = "HOME WINS";
      else if (scoreA > scoreH) result = "AWAY WINS";
      ctx.fillStyle = scoreH > scoreA ? "#7eb6ff" : scoreA > scoreH ? "#ff8a8a" : "#d4e8c8";
      ctx.font = "bold 22px Trebuchet MS, sans-serif";
      ctx.fillText(result, W / 2, H * 0.60);
      const pulse = 0.85 + Math.sin(titlePulse * 3) * 0.15;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px Trebuchet MS, sans-serif";
      ctx.fillText("Press  SPACE  or  click  to play again", W / 2, H * 0.74);
      ctx.globalAlpha = 1;
    }
  }

  // ── Loop ────────────────────────────────────────────────
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    titlePulse += dt;

    if (state === "play") {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (currentHalf === 1) {
          state = "halftime";
          sfxWhistle();
        } else {
          state = "over";
          sfxWhistle();
        }
      } else {
        updateHuman(dt);
        updateAI(dt);
        
        const allPlayers = [...homePlayers, ...awayPlayers];
        collidePlayers(allPlayers);
        
        for (const p of allPlayers) {
          collideBallPlayer(p);
        }
        
        updateBall(dt);
      }
    } else if (state === "goal") {
      goalFlash -= dt;
      shake *= Math.pow(0.04, dt);
      updateParticles(dt);
      updateBall(dt * 0.35);
      if (goalFlash <= 0) afterGoal();
    } else {
      updateParticles(dt);
    }

    updateParticles(dt);
    if (shake > 0.2) shake *= Math.pow(0.02, dt);
    else shake = 0;

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawPitch();
    
    if (state !== "setup") {
      // Draw all players
      for (const p of homePlayers) {
        drawPlayer(p, "#1d4ed8", "#60a5fa", p === controlledPlayer);
      }
      for (const p of awayPlayers) {
        drawPlayer(p, "#b91c1c", "#f87171", p === controlledPlayer);
      }
      drawBall();
    }
    
    drawParticles();
    ctx.restore();

    if (state !== "setup") {
      drawHUD();
    }
    drawOverlay();

    requestAnimationFrame(frame);
  }

  resetPositions();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
